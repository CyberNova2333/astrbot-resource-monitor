name: astrbot_plugin_resource_watch
desc: 资源分发线路监控——按客户端的判据探线路，把「用户装不上、但没人报」的静默故障喊出来
help: |
  /线路 状态          当前所有探针的红绿一览
  /线路 测 <线路名>    立刻对某条线路跑一轮全部探针
  /线路 配置          打印线上配置的关键字段（版本闸门、启用了哪几条线、阈值）
  /线路 静音 30m      维护窗口，自己调线路时别被自己的 bot 轰炸（默认限管理员）
  /线路 取消静音
  /线路 覆盖率        抽样块校验目前覆盖到了百分之几
  /线路 通知          查看本会话最早一条待处理通知，查看不会清除
  /线路 确认          管理员确认自己上次在本会话查看的那条通知

  QQ 官方支持 WebSocket / Webhook、群聊与 C2C 私聊。通知会话填写实际完整 UMO，
  管理员使用平台实际用户 ID；QQ 官方的 OpenID 不是日常 QQ 号。新会话或重启后
  先与机器人对话。消息使用纯文本，链接省略，全体提及降级为文字提示。
  主动通知受框架能力与平台权限限制；提交尝试不代表送达。未抛出异常的尝试不重复
  自动发送，通知仍保留供查询，并由管理员确认；明确发送异常会继续重试。

  配置只需要一个入口地址（entry_url），线路表 / 文件清单 / 阈值全部运行时从
  线上配置现取——插件里不留第二份，抄一份就会漂移。
version: 0.1.0
author: Resource Monitor Contributors
