name: 文档站 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - repo-docs/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: '仅构建文档产物，跳过上传与部署 GitHub Pages'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: docs-site/package.json
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: 安装文档依赖
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: 构建文档站
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -eu
          if [ -f docs-site/public/CNAME ]; then
            pnpm --dir docs-site run docs:build
          else
            base="${PAGES_BASE_PATH%/}/"
            pnpm --dir docs-site run docs:build --base "$base"
          fi
      - name: 核对并补充 Pages 文件
        run: |
          set -eu
          test -f docs-site/.vitepress/dist/index.html
          touch docs-site/.vitepress/dist/.nojekyll
          if [ -f docs-site/public/CNAME ]; then
            cp docs-site/public/CNAME docs-site/.vitepress/dist/CNAME
          fi
      - name: 上传 Pages 产物
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: 部署到 GitHub Pages
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
