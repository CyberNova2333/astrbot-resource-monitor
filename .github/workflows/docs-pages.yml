name: 文档站 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - repo-docs/**
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: 安装文档依赖
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: 构建文档站
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -eu
          if [ -f docs-site/public/CNAME ]; then
            pnpm --dir docs-site run docs:build
          else
            base="${PAGES_BASE_PATH%/}/"
            pnpm --dir docs-site run docs:build --base "$base"
          fi
      - name: 核对并补充 Pages 文件
        run: |
          set -eu
          test -f docs-site/.vitepress/dist/index.html
          touch docs-site/.vitepress/dist/.nojekyll
          if [ -f docs-site/public/CNAME ]; then
            cp docs-site/public/CNAME docs-site/.vitepress/dist/CNAME
          fi
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
