name: 自动同步 ASSETS_LICENSES

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets-licenses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-assets-licenses:
    name: 检查并增量同步 ASSETS_LICENSES.md
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTHORS_VAR_TOKEN || secrets.GH_PAT || github.token }}

      - name: 检查或增量同步 ASSETS_LICENSES.md
        env:
          GH_TOKEN: ${{ secrets.AUTHORS_VAR_TOKEN || secrets.GH_PAT || github.token }}
          SAVED_MANIFEST_HASH: ${{ vars.ASSETS_LICENSES_HASH }}
        run: |
          set -euo pipefail
          python3 - github <<'PY'
          import base64
          from collections import Counter
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          PLATFORM = sys.argv[1] if len(sys.argv) > 1 else "github"
          CHECK_ONLY = "--check" in sys.argv[2:]
          DRY_RUN = "--dry-run" in sys.argv[2:]

          GH_NOREPLY_RE = re.compile(
              r"^(?:(\d+)\+)?([A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)@users\.noreply\.github\.com$",
              re.I,
          )
          EMAIL_FIND_RE = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          GH_URL_RE = re.compile(r"https?://github\.com/([A-Za-z0-9-]+)", re.I)
          CNB_URL_RE = re.compile(r"https?://[^/\s`]+/u/([A-Za-z0-9_.-]+)", re.I)
          TRAILER_RE = re.compile(r"^\s*([^<>]+?)\s*<([^<>@\s]+@[^<>\s]+)>\s*$")
          AI_HANDLE_SUFFIXES = ("-assist", "-agent", "-copilot")
          ROLE_ORDER = ("Committer", "Author", "Co-authored-by")
          CONSENT_NO = "[附加条款：未发表意见]"


          def is_cnb_noreply(domain: str) -> bool:
              parts = domain.lower().split(".")
              return len(parts) >= 3 and parts[0] == "noreply" and parts[1] == "cnb"


          def extract_cnb_user(email: str) -> str | None:
              if "@" not in email:
                  return None
              local, domain = email.rsplit("@", 1)
              if not is_cnb_noreply(domain) or "+" not in local:
                  return None
              return local.split("+", 1)[1]


          def identity_stem(text: str) -> str:
              return re.sub(r"\d+$", "", re.sub(r"\s+", " ", text.strip())).lower()


          def is_excluded_bot(name: str, email: str, role: str) -> bool:
              nl = name.strip().lower()
              el = email.strip().lower()
              local, _, domain = el.partition("@")
              if "." not in domain or domain.endswith(".local"):
                  return True
              if nl.endswith("[bot]") or el.endswith("[bot]@users.noreply.github.com"):
                  m_gh = GH_NOREPLY_RE.match(el)
                  base_handle = re.sub(r"\[bot\]$", "", m_gh.group(2), flags=re.I).lower() if m_gh else ""
                  if not base_handle.endswith(AI_HANDLE_SUFFIXES):
                      return True
              if local in {"actions", "bot", "ci"} or "autobot" in nl or "流水线" in nl:
                  return True
              if local == "noreply" and (domain.startswith("github.") or "web-flow." in domain):
                  return True
              if local == "noreply" and domain.startswith("cnb.") and role != "Co-authored-by":
                  return True
              return False


          def is_agent_record(name: str, email: str, role: str) -> bool:
              nl = name.strip().lower()
              el = email.strip().lower()
              local, _, _domain = el.partition("@")
              m_gh = GH_NOREPLY_RE.match(el)
              if m_gh:
                  handle = re.sub(r"\[bot\]$", "", m_gh.group(2), flags=re.I).lower()
                  return handle.endswith(AI_HANDLE_SUFFIXES)
              if extract_cnb_user(el):
                  return False
              if local in {"noreply", "no-reply", "ai", "agent", "assistant"}:
                  return True
              first_token = nl.split()[0] if nl else ""
              if role == "Co-authored-by" and first_token and local == first_token:
                  return True
              return False


          def canonical_agent_name(raw_name: str) -> str:
              cleaned = re.sub(r"\[bot\]$", "", raw_name.strip(), flags=re.I).strip()
              return cleaned.split()[0] if cleaned else raw_name.strip()


          def pick_agent_email(canon_name: str, email_counts: Counter[str]) -> str:
              cl = canon_name.lower()

              def sort_key(item: tuple[str, int]) -> tuple[int, int, int, int, str]:
                  em, count = item
                  local, _, domain = em.partition("@")
                  if GH_NOREPLY_RE.match(em):
                      return (0, -count, 0, 0, em)
                  is_host_proxy = is_cnb_noreply(domain) or domain.startswith("cnb.") or domain.endswith(".cool")
                  dom_match = 0 if domain.startswith(cl + ".") else 1
                  is_noreply = 0 if local == "noreply" else 1
                  return (1 if not is_host_proxy else 2, -count, is_noreply, dom_match, em)

              return sorted(email_counts.items(), key=sort_key)[0][0]


          def resolve_cnb_base(repo: Path | None = None) -> str:
              env_url = os.environ.get("CNB_WEB_ENDPOINT", "").strip()
              if env_url:
                  return env_url.rstrip("/")
              cmd = ["git"] + (["-C", str(repo)] if repo else []) + ["remote", "get-url", "origin"]
              res = subprocess.run(cmd, capture_output=True, text=True)
              m = re.match(r"^(https?://[^/]+)", res.stdout.strip())
              return m.group(1) if m else ""


          def resolve_repo_owner(repo: Path) -> str:
              meta_path = repo / "meta.json"
              if meta_path.is_file():
                  try:
                      data = json.loads(meta_path.read_text("utf-8"))
                      for field in ("repository",):
                          m = re.match(r"^https?://github\.com/([^/]+)/", str(data.get(field, "")))
                          if m:
                              return m.group(1)
                      links = data.get("links")
                      if isinstance(links, dict):
                          m = re.match(r"^https?://github\.com/([^/]+)/", str(links.get("github", "")))
                          if m:
                              return m.group(1)
                  except (OSError, ValueError):
                      pass
              for remote in ("github", "origin"):
                  res = subprocess.run(
                      ["git", "-C", str(repo), "remote", "get-url", remote],
                      capture_output=True,
                      text=True,
                  )
                  m = re.search(r"github\.com[:/]([^/]+)/", res.stdout.strip())
                  if m:
                      return m.group(1)
              return ""


          def email_sort_key(email: str) -> tuple[int, str]:
              el = email.lower()
              m = GH_NOREPLY_RE.match(el)
              if m:
                  return (0 if m.group(1) else 1, el)
              if extract_cnb_user(el):
                  return (2, el)
              return (3, el)


          def name_sort_key(name: str) -> tuple[int, int, str]:
              has_upper = any(c.isupper() for c in name)
              return (0 if has_upper else 1, -len(name), name.lower())


          def collect_git_identities(repo: Path) -> tuple[list[dict], list[dict]]:
              is_shallow = subprocess.check_output(
                  ["git", "-C", str(repo), "rev-parse", "--is-shallow-repository"], text=True
              ).strip()
              if is_shallow == "true" and not CHECK_ONLY and not DRY_RUN:
                  subprocess.run(["git", "-C", str(repo), "fetch", "--unshallow", "--quiet"], check=False)

              fmt = "%H%x00%s%x00%an%x00%ae%x00%cn%x00%ce%x00%(trailers:key=Co-authored-by,valueonly,separator=%x1f)%x1e"
              raw = subprocess.check_output(
                  ["git", "-C", str(repo), "log", "HEAD", "--reverse", f"--format={fmt}"],
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
              cnb_base = resolve_cnb_base(repo)
              repo_owner = resolve_repo_owner(repo)
              owner_stem = identity_stem(repo_owner) if repo_owner else ""

              human_records: list[dict] = []
              agents: dict[str, dict] = {}

              def record(name: str, email: str, role: str) -> None:
                  name = name.strip()
                  email = email.strip()
                  if not name or not email or is_excluded_bot(name, email, role):
                      return
                  if is_agent_record(name, email, role):
                      cname = canonical_agent_name(name)
                      ckey = cname.lower()
                      ent = agents.setdefault(
                          ckey,
                          {"name": cname, "emails": Counter(), "link": None, "roles": set()},
                      )
                      if any(c.isupper() for c in cname) and not any(c.isupper() for c in ent["name"]):
                          ent["name"] = cname
                      m_gh = GH_NOREPLY_RE.match(email)
                      if m_gh:
                          gh_user = re.sub(r"\[bot\]$", "", m_gh.group(2), flags=re.I)
                          ent["emails"][email] += 1
                          ent["link"] = f"https://github.com/apps/{gh_user}"
                      else:
                          ent["emails"][email.lower()] += 1
                      entry_roles = ent["roles"]
                      entry_roles.add(role)
                      return

                  el = email.lower()
                  nl = re.sub(r"\s+", " ", name).lower()
                  keys = {f"email:{el}", f"name:{nl}", f"stem:{identity_stem(name)}"}
                  links: set[str] = set()
                  m_gh = GH_NOREPLY_RE.match(email)
                  if m_gh:
                      gh_u = m_gh.group(2)
                      keys.update({f"gh:{gh_u.lower()}", f"name:{gh_u.lower()}", f"stem:{identity_stem(gh_u)}"})
                      links.add(f"https://github.com/{gh_u}")
                  cu = extract_cnb_user(email)
                  if cu:
                      keys.update({f"cnb:{cu.lower()}", f"name:{cu.lower()}", f"stem:{identity_stem(cu)}"})
                      if PLATFORM == "cnb" and cnb_base:
                          links.add(f"{cnb_base}/u/{cu}")
                      elif PLATFORM == "github" and repo_owner and identity_stem(cu) == owner_stem:
                          links.add(f"https://github.com/{repo_owner}")
                  if PLATFORM == "github" and repo_owner and identity_stem(name) == owner_stem:
                      links.add(f"https://github.com/{repo_owner}")

                  human_records.append(
                      {
                          "names": {name},
                          "emails": {email},
                          "links": links,
                          "roles": {role},
                          "keys": keys,
                      }
                  )

              for rec in raw.split("\x1e"):
                  rec = rec.strip("\r\n")
                  if not rec:
                      continue
                  parts = rec.split("\x00")
                  if len(parts) < 7:
                      continue
                  _sha, subject, an, ae, cn, ce, trailers = parts[:7]
                  subj = subject.strip()
                  if (subj.startswith("chore(authors):") or subj.startswith("chore(licenses):")) and is_excluded_bot(an, ae, "Author") and is_excluded_bot(cn, ce, "Committer"):
                      continue
                  record(cn, ce, "Committer")
                  record(an, ae, "Author")
                  for t in trailers.split("\x1f"):
                      t = t.strip()
                      if not t:
                          continue
                      m = TRAILER_RE.match(t)
                      if m:
                          record(m.group(1), m.group(2), "Co-authored-by")

              merged: list[dict] = []
              for item in human_records:
                  matched = [ex for ex in merged if ex["keys"] & item["keys"]]
                  if not matched:
                      merged.append(item)
                  else:
                      primary = matched[0]
                      for other in matched[1:]:
                          primary["names"] |= other["names"]
                          primary["emails"] |= other["emails"]
                          primary["links"] |= other["links"]
                          primary["roles"] |= other["roles"]
                          primary["keys"] |= other["keys"]
                          merged.remove(other)
                      primary["names"] |= item["names"]
                      primary["emails"] |= item["emails"]
                      primary["links"] |= item["links"]
                      primary["roles"] |= item["roles"]
                      primary["keys"] |= item["keys"]

              agent_list = []
              for ckey in sorted(agents.keys()):
                  ent = agents[ckey]
                  agent_list.append(
                      {
                          "name": ent["name"],
                          "ckey": ckey,
                          "cemail": pick_agent_email(ent["name"], ent["emails"]),
                          "all_emails": {e.lower() for e in ent["emails"]},
                          "link": ent["link"],
                          "roles": [r for r in ROLE_ORDER if r in ent["roles"]],
                      }
                  )
              return merged, agent_list


          def split_md_row(line: str) -> list[str]:
              return [c.strip() for c in line.strip()[1:-1].split("|")]


          def extract_account_keys(text: str) -> set[str]:
              keys: set[str] = set()
              for em in EMAIL_FIND_RE.findall(text):
                  el = em.lower()
                  keys.add(f"email:{el}")
                  m_gh = GH_NOREPLY_RE.match(el)
                  if m_gh:
                      gh_u = m_gh.group(2)
                      keys.update({f"gh:{gh_u.lower()}", f"name:{gh_u.lower()}", f"stem:{identity_stem(gh_u)}"})
                  cu = extract_cnb_user(el)
                  if cu:
                      keys.update({f"cnb:{cu.lower()}", f"name:{cu.lower()}", f"stem:{identity_stem(cu)}"})
              for gh_u in GH_URL_RE.findall(text):
                  gl = gh_u.lower()
                  if gl not in {"apps", "topics", "orgs", "features"}:
                      keys.update({f"gh:{gl}", f"name:{gl}", f"stem:{identity_stem(gl)}"})
              for cnb_u in CNB_URL_RE.findall(text):
                  cl = cnb_u.lower()
                  keys.update({f"cnb:{cl}", f"name:{cl}", f"stem:{identity_stem(cl)}"})
              return keys


          def sync_manifest(repo: Path, manifest_text: str) -> tuple[str, bool, list[str]]:
              """Incrementally append newly discovered human contributors and AI tools into ASSETS_LICENSES.md.
              Never modifies or removes existing human rows, consent statuses, or sections 1.3, 3.*, and 4.*."""
              humans, agent_list = collect_git_identities(repo)
              had_trailing_nl = manifest_text.endswith("\n")
              lines = manifest_text.splitlines()

              sec = ""
              t11_last = -1
              t12_last = -1
              t2_last = -1
              t2_placeholder_idx = -1
              max_p = 0
              max_auth = 0
              max_t = 0
              human_keys: set[str] = set()
              agent_keys: set[str] = set()
              real_agent_rows = 0

              for i, raw in enumerate(lines):
                  s = raw.strip()
                  if s.startswith("## "):
                      if s.startswith("## 一、"):
                          sec = "1"
                      elif s.startswith("## 二、"):
                          sec = "2"
                      else:
                          sec = "other"
                      continue
                  if sec.startswith("1") and s.startswith("### "):
                      if s.startswith("### 1.1"):
                          sec = "1.1"
                      elif s.startswith("### 1.2"):
                          sec = "1.2"
                      elif s.startswith("### 1.3"):
                          sec = "1.3"
                      else:
                          sec = "1.other"
                      continue
                  if sec not in ("1.1", "1.2", "2") or not s.startswith("|"):
                      continue
                  if re.match(r"^\|[\s:|-]+\|$", s):
                      if sec == "1.1":
                          t11_last = i
                      elif sec == "1.2":
                          t12_last = i
                      elif sec == "2":
                          t2_last = i
                      continue

                  cols = split_md_row(s)
                  c0 = cols[0].strip("` ") if cols else ""
                  if sec == "1.1":
                      t11_last = i
                      if c0 in ("记录编号",) or c0.startswith("["):
                          continue
                      m_id = re.match(r"^P-(\d+)$", c0)
                      if m_id:
                          max_p = max(max_p, int(m_id.group(1)))
                      if len(cols) >= 3:
                          disp = cols[1].split("（", 1)[0].split("(", 1)[0].strip("` ").strip()
                          if disp:
                              disp_norm = re.sub(r"\s+", " ", disp).lower()
                              human_keys.add(f"name:{disp_norm}")
                              human_keys.add(f"stem:{identity_stem(disp)}")
                          human_keys.update(extract_account_keys(cols[2]))
                  elif sec == "1.2":
                      t12_last = i
                      if c0.startswith("授权记录编号") or c0.startswith("["):
                          continue
                      m_aid = re.search(r"\bAUTH-(\d+)\b", cols[0])
                      if m_aid:
                          max_auth = max(max_auth, int(m_aid.group(1)))
                  elif sec == "2":
                      t2_last = i
                      if c0.startswith("工具记录编号") or c0.startswith("["):
                          continue
                      tid_part = re.split(r"[；;]", c0, maxsplit=1)[0].strip("` ")
                      if tid_part == "T-00":
                          t2_placeholder_idx = i
                          continue
                      real_agent_rows += 1
                      m_tid = re.match(r"^T-(\d+)$", tid_part)
                      if m_tid:
                          max_t = max(max_t, int(m_tid.group(1)))
                      raw_aname = re.sub(r"^`?T-\d+`?\s*[；;]\s*", "", cols[0]).strip()
                      aname = raw_aname.split("（", 1)[0].split("(", 1)[0].strip("` ").strip()
                      if aname:
                          agent_keys.add(f"name:{aname.lower()}")
                          agent_keys.add(f"name:{canonical_agent_name(aname).lower()}")
                      if len(cols) >= 2:
                          agent_keys.update(extract_account_keys(cols[1]))

              new_11: list[str] = []
              new_12: list[str] = []
              added_notes: list[str] = []

              for ent in humans:
                  if ent["keys"] & human_keys:
                      continue
                  max_p += 1
                  max_auth += 1
                  pid = f"P-{max_p:02d}"
                  aid = f"AUTH-{max_auth:02d}"
                  dname = sorted(ent["names"], key=name_sort_key)[0]
                  emails_str = ", ".join(sorted(ent["emails"], key=email_sort_key))
                  links = sorted(ent["links"])
                  acct = (
                      f"`{', '.join(links)}` / `{emails_str}`" if links else f"`{emails_str}`"
                  )
                  roles = ", ".join(r for r in ROLE_ORDER if r in ent["roles"])
                  new_11.append(
                      f"| `{pid}` | {dname}（Git 贡献者；Git 角色：{roles}） | {acct} | "
                      f"见本仓库 Git 提交历史（待维护者核实具体材料与权属范围） | 本仓库 Git 提交历史（自动检测新增） | `{CONSENT_NO}`（见 `{aid}`） |"
                  )
                  new_12.append(
                      f"| `{aid}`；`{pid}` | {dname}（尚未核实实际声明主体与代表权限） | "
                      f"见本仓库 Git 历史中对应提交（待核实） | 未覆盖（尚无可核实明确同意；自动化工作流不代授同意） | "
                      f"未覆盖（尚无可核实明确授权；不得由提交记录推定） | 尚无可核实明确意见；依 v1.6.7-r4 第 1.7—1.9 款保留原基础许可边界 |"
                  )
                  human_keys.update(ent["keys"])
                  added_notes.append(f"human:{dname}")

              new_2: list[str] = []
              for agent in agent_list:
                  hit = f"name:{agent['ckey']}" in agent_keys or any(
                      f"email:{em}" in agent_keys for em in agent["all_emails"]
                  )
                  if hit:
                      continue
                  max_t += 1
                  tid = f"T-{max_t:02d}"
                  acct = f"`{agent['cemail']}`" + (f"（{agent['link']}）" if agent["link"] else "")
                  roles = ", ".join(agent["roles"])
                  new_2.append(
                      f"| `{tid}`；{agent['name']}（AI 编程辅助工具） | {acct} | "
                      f"在人类维护者指令、审阅与提交操作下参与工程辅助（Git 字段角色：{roles}） | "
                      f"见本仓库 Git 提交历史 `Co-authored-by` / 工具记录 | 待关联实际人类主体（工具本身非版权许可授权主体） | "
                      f"由工作流自 Git 历史自动登记；工具本身不标注附加条款同意状态，依 v1.6.7-r4 第 1.4、1.8 款处理 |"
                  )
                  agent_keys.add(f"name:{agent['ckey']}")
                  agent_keys.update(f"email:{em}" for em in agent["all_emails"])
                  added_notes.append(f"agent:{agent['name']}")

              if not new_11 and not new_2:
                  return manifest_text, False, []

              # Apply insertions bottom-up so earlier line indices remain valid.
              if new_2 and t2_last >= 0:
                  if t2_placeholder_idx >= 0 and real_agent_rows == 0:
                      lines[t2_placeholder_idx : t2_placeholder_idx + 1] = new_2
                  else:
                      lines[t2_last + 1 : t2_last + 1] = new_2
              if new_12 and t12_last >= 0:
                  lines[t12_last + 1 : t12_last + 1] = new_12
              if new_11 and t11_last >= 0:
                  lines[t11_last + 1 : t11_last + 1] = new_11

              today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              out_lines = [
                  re.sub(r"^(\*\*清单最后更新日期：\*\*\s*`?)[^`\n]+(`?\s*)$", rf"\g<1>{today}\g<2>", line)
                  if line.startswith("**清单最后更新日期：**")
                  else line
                  for line in lines
              ]
              new_text = "\n".join(out_lines) + ("\n" if had_trailing_nl else "")
              return new_text, True, added_notes


          def norm(text: str) -> str:
              return text.replace("\r\n", "\n").rstrip("\n") + "\n" if text else ""


          def main() -> int:
              repo = Path(".").resolve()
              manifest_path = repo / "ASSETS_LICENSES.md"
              if not manifest_path.is_file():
                  print("未找到根目录 ASSETS_LICENSES.md，跳过同步。")
                  return 0

              existing = manifest_path.read_text("utf-8")
              new_text, file_changed, added_notes = sync_manifest(repo, existing)
              new_hash = hashlib.sha256(new_text.encode("utf-8")).hexdigest()

              if CHECK_ONLY or DRY_RUN:
                  print(
                      f"ASSETS_LICENSES.md SHA-256: {new_hash} "
                      f"(pending_updates={len(added_notes)}: {added_notes})"
                  )
                  if CHECK_ONLY and file_changed:
                      return 1
                  return 0

              if PLATFORM == "github":
                  saved_hash = os.environ.get("SAVED_MANIFEST_HASH", "").strip()
                  var_changed = saved_hash != new_hash
                  print(f"ASSETS_LICENSES SHA-256: {new_hash} (vars_hash={saved_hash or '<unset>'}, added={added_notes})")
                  if not file_changed and not var_changed:
                      print("ASSETS_LICENSES.md 与 GitHub Variables 均为最新，跳过提交（零噪音）。")
                      return 0
                  if file_changed:
                      manifest_path.write_text(new_text, encoding="utf-8", newline="\n")
                      subprocess.run(["git", "add", "ASSETS_LICENSES.md"], check=True)
                      if subprocess.run(["git", "diff", "--cached", "--quiet", "--", "ASSETS_LICENSES.md"]).returncode != 0:
                          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
                          subprocess.run(
                              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
                              check=True,
                          )
                          msg = (
                              "chore(licenses): 自动同步 ASSETS_LICENSES.md 新增贡献记录 [skip ci]\n\n"
                              "文档: 依据当前完整 Git 提交历史增量登记新增人类贡献者（默认未发表意见）与 AI 辅助工具至 ASSETS_LICENSES.md。\n\n"
                              "[skip-hooks]\n"
                              "Generated-by: GitHub Actions\n"
                          )
                          subprocess.run(["git", "commit", "-m", msg], check=True)
                          branch = os.environ.get("GITHUB_REF_NAME", "main")
                          subprocess.run(["git", "push", "origin", f"HEAD:refs/heads/{branch}"], check=True)
                          print("已将更新后的 ASSETS_LICENSES.md 推送至 GitHub。")
                  if var_changed and os.environ.get("GH_TOKEN") and os.environ.get("GITHUB_REPOSITORY"):
                      repo_slug = os.environ["GITHUB_REPOSITORY"]
                      r1 = subprocess.run(
                          ["gh", "variable", "set", "ASSETS_LICENSES_HASH", "-R", repo_slug, "--body", new_hash],
                          capture_output=True,
                          text=True,
                      )
                      if r1.returncode == 0:
                          print("已同步更新 GitHub Variable (ASSETS_LICENSES_HASH)。")
                      else:
                          print("提示：当前令牌无权写入 Actions Variables，已依托仓库文件增量检测跳过重复提交。")
              else:
                  print(f"ASSETS_LICENSES SHA-256: {new_hash} (changed={file_changed}, added={added_notes})")
                  if not file_changed:
                      print("ASSETS_LICENSES.md 无新增贡献者或 AI 工具记录，跳过提交。")
                      return 0
                  manifest_path.write_text(new_text, encoding="utf-8", newline="\n")
                  subprocess.run(["git", "add", "ASSETS_LICENSES.md"], check=True)
                  if subprocess.run(["git", "diff", "--cached", "--quiet", "--", "ASSETS_LICENSES.md"]).returncode != 0:
                      subprocess.run(["git", "config", "user.name", "cnb"], check=True)
                      subprocess.run(["git", "config", "user.email", "noreply" + "@cnb." + "local"], check=True)
                      msg = (
                          "chore(licenses): 自动同步 ASSETS_LICENSES.md 新增贡献记录 [skip ci]\n\n"
                          "文档: 依据当前完整 Git 提交历史增量登记新增人类贡献者（默认未发表意见）与 AI 辅助工具至 ASSETS_LICENSES.md。\n\n"
                          "[skip-hooks]\n"
                      )
                      subprocess.run(["git", "commit", "-m", msg], check=True)
                      base = resolve_cnb_base()
                      slug = os.environ.get("CNB_REPO_SLUG", "").strip()
                      user = os.environ.get("CNB_TOKEN_USER_NAME", "cnb").strip()
                      tok = os.environ.get("CNB_TOKEN", "").strip()
                      branch = os.environ.get("CNB_BRANCH", "main").strip()
                      if not (base and slug and tok):
                          raise RuntimeError("缺少 CNB 推送所需环境变量")
                      auth_b64 = base64.b64encode(f"{user}:{tok}".encode("utf-8")).decode("ascii")
                      push_env = dict(os.environ)
                      push_env["GIT_TERMINAL_PROMPT"] = "0"
                      push_env["GIT_CONFIG_COUNT"] = "1"
                      push_env["GIT_CONFIG_KEY_0"] = f"http.{base}/.extraHeader"
                      push_env["GIT_CONFIG_VALUE_0"] = f"AUTHORIZATION: Basic {auth_b64}"
                      push_res = subprocess.run(
                          ["git", "push", f"{base}/{slug}", f"HEAD:refs/heads/{branch}", "-o", "ci.skip"],
                          env=push_env,
                          capture_output=True,
                          text=True,
                      )
                      if push_res.returncode != 0:
                          err_text = (push_res.stderr or push_res.stdout or "").replace(tok, "***").replace(auth_b64, "***")
                          raise RuntimeError(f"CNB 推送失败（退出码 {push_res.returncode}）：{err_text.strip()}")
                      print("已将更新后的 ASSETS_LICENSES.md 推送至镜像仓库。")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
