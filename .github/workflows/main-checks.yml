name: ✅ 检查

# ╔════════════════════════════════════════════════════════════════════╗
# ║  只做检查，不发布、不部署、不改仓库内容（CONTRIBUTING.md §五）。     ║
# ║                                                                    ║
# ║  地址守卫在 pre-push 钩子里已经拦过一道，这里再跑一次——钩子只管得住 ║
# ║  装了钩子的克隆，而「在别处提交再推进来」正是它挡不住的形状。       ║
# ╚════════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main, 'hotfix/**', 'surgery/**']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: '手动触发检查范围（all / checks / http-transport）'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'checks'
          - 'http-transport'
      test_pattern:
        description: '可选：判据层测试传给 unittest -k 的筛选关键字'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📦 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🐍 装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 🔒 地址守卫（铁律 1：地址/凭证不入库）
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B tools/check-no-endpoints.py --verbose
          python3 -B - <<'PY'
          import os, subprocess, sys
          base = os.environ.get('PR_BASE') or os.environ.get('PUSH_BASE', '')
          known = bool(base.strip('0')) and subprocess.run(
              ['git', 'cat-file', '-e', base + '^{commit}'], capture_output=True).returncode == 0
          if not known:
              print('拿不到可达 before（新建分支、手动触发或历史重放），跳过历史回溯；工作树已由 --verbose 完整检查。')
              raise SystemExit(0)
          commits = subprocess.check_output(['git', 'rev-list', base + '..HEAD'], text=True)
          if commits.strip():
              subprocess.run([sys.executable, '-B', 'tools/check-no-endpoints.py', '--commits-stdin'],
                             input=commits, text=True, check=True)
          PY

      # 判据层测试刻意**不装任何第三方包**：探针只认 watch/http.py 里的协议，
      # 测试喂假实现。装依赖跑测试等于让 CI 的绿灯依赖 PyPI 当天的心情。
      - name: 🧪 判据层测试（离线，不打真线路）
        env:
          TEST_PATTERN: ${{ github.event_name == 'workflow_dispatch' && inputs.test_pattern || '' }}
        run: |
          if [ -n "$TEST_PATTERN" ]; then
            python3 -B -m unittest discover -s tests -t . -k "$TEST_PATTERN" -v
          else
            python3 -B -m unittest discover -s tests -t . -v
          fi

      - name: 🧮 语法
        run: python3 -B -m compileall -q tools watch main.py

  http-transport:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'http-transport' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装运行依赖
        run: python3 -m pip install -r requirements.txt
      - name: HTTP 连接层回归（离线替身，不访问真实线路）
        run: python3 -B -m unittest tests.test_network_regressions -v
